[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fin-rag"
version = "0.1.0"
description = "Local financial report retrieval with auditable page citations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pymupdf>=1.25,<2", "qdrant-client>=1.14,<2", "fastembed>=0.6,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
docling = ["docling>=2.50,<3"]
layout = ["pymupdf4llm>=1.28.2,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
